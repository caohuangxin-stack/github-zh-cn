<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub 中文插件</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        width: 260px;
        margin: 0;
        padding: 14px 16px;
        font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #f6f8fa;
        color: #1f2328;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0d1117;
          color: #e6edf3;
        }
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      .row {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin: 8px 0;
      }
      .row input {
        margin-top: 3px;
      }
      .row .sub {
        color: #59636e;
        font-size: 12px;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 6px 10px;
        border: 1px solid #d0d7de;
        border-radius: 6px;
        background: #f6f8fa;
        cursor: pointer;
      }
      button.primary {
        background: #1f883d;
        border-color: #1f883d;
        color: #fff;
      }
      .note {
        margin-top: 10px;
        font-size: 12px;
        color: #59636e;
      }
    </style>
  </head>
  <body>
    <h1>GitHub 中文插件</h1>
    <label class="row">
      <input type="checkbox" id="dict" />
      <span>界面汉化（常用词库）</span>
    </label>
    <div class="row" style="margin-left: 24px; margin-top: -4px">
      <span class="sub">即时生效，翻译按钮、菜单等常见界面文字</span>
    </div>
    <label class="row">
      <input type="checkbox" id="full" />
      <span>整页翻译（Google 翻译）</span>
    </label>
    <div class="row" style="margin-left: 24px; margin-top: -4px">
      <span class="sub">把页面上的英文段落也翻成中文</span>
    </div>
    <button class="primary" id="translate-now">立即翻译整页</button>
    <button id="restore">恢复英文原文</button>
    <div class="note">仅对 github.com 生效。整页翻译为机器翻译，仅供参考。</div>
    <script src="popup.js"></script>
  </body>
</html>
